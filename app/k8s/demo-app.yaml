# demo-app · estado "ANTES": 4 réplicas con requests inflados a propósito
# (cpu: 1, memory: 1Gi) para que el tablero "uso vs. requests" muestre la brecha.
# Reemplazar ACCOUNT_PLACEHOLDER por el ID de la cuenta antes de aplicar:
#   sed "s/ACCOUNT_PLACEHOLDER/$ACCOUNT/" app/k8s/demo-app.yaml | kubectl --context dev apply -f -
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo
  labels:
    goldilocks.fairwinds.com/enabled: "true" # Goldilocks crea los VPA en modo Off
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: demo
  labels:
    app: demo-app
spec:
  replicas: 4
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      nodeSelector:
        karpenter.sh/nodepool: spot-tm # Spot es la base de dev (NodePool en dev/nodepool-spot-tm.yaml)
      terminationGracePeriodSeconds: 10
      containers:
        - name: demo-app
          image: ACCOUNT_PLACEHOLDER.dkr.ecr.us-east-2.amazonaws.com/demo-app:1.1.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: SELF_URL
              value: http://demo-app.demo.svc:80 # el generador reparte la carga por el Service
          resources:
            requests:
              cpu: "1" # inflado: el uso real es ~50m
              memory: 1Gi # inflado: el uso real es ~80Mi
            limits:
              memory: 1Gi # limit de memoria sí; limit de CPU no (ver palanca 4)
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: demo
  labels:
    app: demo-app
spec:
  type: ClusterIP
  selector:
    app: demo-app
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Para que la consolidación de Auto Mode no tire todas las réplicas a la vez (palanca 5)
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: demo-app
  namespace: demo
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: demo-app
---
# El Prometheus de dev scrapea /metrics y lo manda a shared por remote_write
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: demo-app
  namespace: demo
  labels:
    app: demo-app
spec:
  selector:
    matchLabels:
      app: demo-app
  namespaceSelector:
    matchNames: ["demo"]
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
